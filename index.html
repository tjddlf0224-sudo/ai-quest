<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 탐험대</title>
<link rel="icon" href="assets/img/compass.webp">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--ink:#1d2433;--ink2:#4a5263;--mute:#8a91a0;--line:#e6e8ee;--bg:#f6f4ef;--card:#fff;--coral:#ff6b4a;--coral-soft:#ffe9e3;--mint:#1fb88a;--mint-soft:#dff6ee;--sky:#3c8df0;--sky-soft:#e3efff;--sun:#ffc23d;--sun-soft:#fff4d6;--red:#e5484d;--red-soft:#fdeaea;--lav:#8a6cf0;--lav-soft:#efe9ff;--r:18px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:17px;line-height:1.55;word-break:keep-all}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:14px;padding:12px 18px;font-weight:700;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);transition:transform .08s,box-shadow .15s,background .15s}
button:active{transform:scale(.97)}
button:disabled{opacity:.45;cursor:default}
.b-pri{background:var(--coral);color:#fff;box-shadow:0 6px 16px rgba(255,107,74,.28)}
.b-mint{background:var(--mint);color:#fff;box-shadow:0 6px 16px rgba(31,184,138,.25)}
.b-sky{background:var(--sky);color:#fff}
.b-red{background:var(--red-soft);color:var(--red);box-shadow:inset 0 0 0 1.5px #f6c2c3}
.b-ghost{background:transparent;box-shadow:none;color:var(--ink2);padding:8px 10px}
.b-sm{padding:8px 12px;font-size:15px;border-radius:11px}
input,textarea{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:13px 15px;background:#fff;outline:none}
input:focus,textarea:focus{border-color:var(--sky);box-shadow:0 0 0 4px var(--sky-soft)}
textarea{min-height:110px;resize:vertical}
.wrap{max-width:980px;margin:0 auto;padding:18px 18px 120px}
.card{background:var(--card);border-radius:var(--r);padding:22px;box-shadow:0 1px 0 rgba(0,0,0,.03),0 8px 28px rgba(29,36,51,.06)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.mute{color:var(--mute)} .ink2{color:var(--ink2)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:14px;font-weight:700}
.p-coral{background:var(--coral-soft);color:#c8452a}.p-mint{background:var(--mint-soft);color:#0f7a5a}.p-sky{background:var(--sky-soft);color:#215fb0}.p-sun{background:var(--sun-soft);color:#9a6a00}.p-lav{background:var(--lav-soft);color:#5b3fc4}.p-red{background:var(--red-soft);color:#b42d31}.p-gray{background:#eef0f4;color:var(--ink2)}
.ico{width:1.4em;height:1.4em;object-fit:contain;vertical-align:-.3em}
.ico-lg{width:84px;height:84px;object-fit:contain}
.ico-md{width:44px;height:44px;object-fit:contain}
h1,h2,h3{margin:0;letter-spacing:-.02em}
h1{font-size:30px}h2{font-size:24px}h3{font-size:19px}
.err{color:var(--red);font-weight:700;margin-top:8px}
.okmsg{color:#0f7a5a;font-weight:800}
.small{font-size:14px}
.hide{display:none!important}
/* 상단 */
.top{position:sticky;top:0;z-index:20;background:rgba(246,244,239,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .in{max-width:980px;margin:0 auto;padding:10px 18px;display:flex;gap:12px;align-items:center}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:19px}
.logo img{width:30px;height:30px}
.dots{display:flex;gap:5px;align-items:center}
.dots i{width:22px;height:8px;border-radius:5px;background:#dfe2e8;display:block}
.dots i.on{background:var(--coral)} .dots i.done{background:var(--mint)} .dots i.miss{background:var(--sun)}
.score{font-weight:900;font-size:18px}
/* 미션 */
.mhead{display:flex;gap:18px;align-items:center}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:16px}
.step{border:1.5px solid var(--line);border-radius:16px;overflow:hidden;background:#fbfbfd}
.step .im{aspect-ratio:16/10;background:#eef0f5 center/cover no-repeat;display:flex;align-items:center;justify-content:center;cursor:zoom-in}
.step .im.noimg{cursor:default}
.step .im img.ph{width:72px;height:72px;object-fit:contain;opacity:.9}
.step .im img.shot{width:100%;height:100%;object-fit:contain;background:#fff}
.step .tx{padding:11px 13px;font-size:16px}
.step .n{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;align-items:center;justify-content:center;font-size:14px;font-weight:800;margin-right:6px}
.prompt{background:#1d2433;color:#fff;border-radius:16px;padding:16px 18px;margin-top:14px;position:relative}
.prompt pre{margin:0;white-space:pre-wrap;font-family:inherit;font-size:16px;line-height:1.6}
.prompt .cp{position:absolute;right:12px;top:12px;background:var(--coral);color:#fff;box-shadow:none;padding:7px 14px;font-size:14px}
.prompt .lab{font-size:12px;letter-spacing:.2em;color:#ffb7a6;font-weight:800;margin-bottom:6px}
.proof{margin-top:18px;border-top:2px dashed var(--line);padding-top:18px}
.done-box{background:var(--mint-soft);border-radius:16px;padding:16px 18px;display:flex;gap:14px;align-items:center}
.done-box b{font-size:20px}
/* 하단 고정 */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);border-top:1px solid var(--line);backdrop-filter:blur(8px)}
.dock .in{max-width:980px;margin:0 auto;padding:12px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dock button{padding:13px 18px}
.ready-on{background:var(--mint)!important;color:#fff!important}
/* 목록 */
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:14px;background:#fafbfc;border:1.5px solid var(--line)}
.li.sos{border-color:#f6c2c3;background:var(--red-soft)}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{display:flex;flex-direction:column;align-items:center;width:84px;text-align:center;font-size:13px;font-weight:700;color:var(--ink2)}
.badge img{width:56px;height:56px;object-fit:contain}
.badge.off img{filter:grayscale(1);opacity:.25}.badge.off{color:#b8bcc6}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.rank{display:flex;flex-direction:column;gap:6px}
.rank .r{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:12px;background:#fafbfc}
.rank .r b{width:26px;text-align:center}
.rank .r.me{background:var(--sun-soft)}
/* 전시관 */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.gcard{background:#fff;border-radius:16px;border:1.5px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:8px}
.gcard .k{font-size:13px;font-weight:800}
.gcard .t{font-weight:800;font-size:17px}
.modal{position:fixed;inset:0;z-index:100;background:rgba(15,20,30,.7);display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{background:#fff;border-radius:20px;width:min(1100px,100%);height:min(86vh,900px);display:flex;flex-direction:column;overflow:hidden}
.modal .bar{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.modal iframe{border:0;flex:1;width:100%;background:#fff}
.zoom img{max-width:94vw;max-height:88vh;border-radius:12px;background:#fff}
/* 축하 */
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:200;background:var(--ink);color:#fff;padding:14px 22px;border-radius:16px;font-weight:800;box-shadow:0 12px 30px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;animation:pop .35s ease-out}
@keyframes pop{from{transform:translate(-50%,-14px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:150;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}
/* 입장 */
.hero{border-radius:24px;overflow:hidden;position:relative;background:#ffe9d8 center/cover no-repeat;min-height:230px;display:flex;align-items:flex-end}
.hero .t{padding:22px 26px;background:linear-gradient(transparent,rgba(255,255,255,.95) 55%);width:100%}
.hero h1{font-size:38px}
/* 강사·전광판 */
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:13px;color:var(--mute);font-weight:700}
.chip{display:inline-flex;width:24px;height:24px;border-radius:7px;align-items:center;justify-content:center;font-size:12px;font-weight:800;margin:1px;cursor:pointer;background:#eef0f4;color:#9aa0ab}
.chip.d{background:var(--mint);color:#fff}.chip.s{background:var(--sun-soft);color:#9a6a00}.chip.cur{outline:2px solid var(--coral)}
.online{width:9px;height:9px;border-radius:50%;display:inline-block;background:#cfd3db}.online.on{background:var(--mint)}
.metric{background:#fff;border-radius:16px;padding:14px 16px}
.metric .v{font-size:30px;font-weight:900;line-height:1.1}
.metric .l{font-size:13px;color:var(--mute);font-weight:700}
.board{min-height:100vh;padding:34px 46px;display:flex;flex-direction:column;gap:24px}
.board h1{font-size:54px}
.bigcode{font-size:96px;font-weight:900;letter-spacing:.06em;line-height:1;color:var(--coral)}
.bar{height:22px;border-radius:12px;background:#e6e8ee;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:12px;background:var(--mint);transition:width .6s}
.podium{display:flex;gap:26px;align-items:flex-end;justify-content:center;margin-top:20px}
.podium .p{width:250px;text-align:center}
.podium .blk{border-radius:20px 20px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:14px;font-size:54px;font-weight:900;color:#fff}
.podium .nm{font-size:30px;font-weight:900;margin-top:8px}
.reveal{animation:rise .7s cubic-bezier(.2,1.4,.4,1)}
@keyframes rise{from{transform:translateY(60px) scale(.8);opacity:0}to{transform:none;opacity:1}}
.cert{border-radius:24px;padding:28px;background:#fff;border:3px solid var(--sun);position:relative;overflow:hidden}
@media (max-width:640px){h1{font-size:25px}.hero h1{font-size:30px}.ico-lg{width:64px;height:64px}.dock button{padding:11px 13px;font-size:15px}.board{padding:18px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>

// ───────── 설정 ─────────

function icon(k, cls) { return '<img class="' + (cls || 'ico') + '" src="' + IMG + (ICONS[k] || k) + '.webp" alt="" onerror="this.style.visibility=\'hidden\'">'; }

var BADGES = [
  ['login', '첫 로그인', 'b_login'], ['chat', '대화의 시작', 'b_chat'], ['skill', '스킬 장인', 'b_skill'], ['hwp', '한글 마스터', 'b_hwp'],
  ['maker', '게임 메이커', 'b_maker'], ['trio', '3대 AI 정복', 'b_trio'], ['helper', '친절한 도우미', 'b_helper'],
  ['star', '인기 스타', 'b_star'], ['finisher', '끝까지 완주', 'b_finisher'], ['explorer', '번외 탐험가', 'b_explorer']
];

// ───────── 미션 ─────────
var GAME_PROMPT = '[과목] 수업에서 [단원]을 복습하는 웹 게임을 만들어줘.\n- 대상: 고등학교 [학년] 학생\n- 방식: [퀴즈 / 타이핑 / 짝 맞추기] 형태, 문제 10개\n- 조건: HTML 파일 하나로, 휴대폰에서도 잘 보이게\n- 정답을 맞히면 점수, 틀리면 해설을 보여줘';
var M = [
  { t: 0, icon: 'split', title: '입장하고 화면 반으로 나누기', min: 5,
    desc: '이 게임 창은 왼쪽, AI 창은 오른쪽에 두고 함께 보면서 진행해요.',
    steps: [
      { img: 'split1', text: '이 창을 누른 채로 <b>윈도우 키 + ←</b> → 화면 왼쪽 절반' },
      { img: 'split2', text: '<b>Ctrl + N</b>으로 크롬 새 창 열기' },
      { img: 'split3', text: '새 창에서 <b>윈도우 키 + →</b> → 오른쪽 절반' }
    ],
    proof: { kind: 'check', label: '화면을 나눴어요' } },
  { t: 1, icon: 'key', title: 'Claude 가입하고 로그인하기', min: 10,
    desc: '오른쪽 창에서 Claude에 들어가 Google 계정으로 가입해요. 휴대폰 문자 인증이 한 번 있어요.',
    links: [{ label: 'Claude 열기', url: 'https://claude.ai' }],
    steps: [
      { img: 'claude1', text: 'claude.ai에서 <b>Google로 계속하기</b>' },
      { img: 'claude2', text: '내 Google 계정 고르기 → <b>휴대폰 번호</b> 넣고 문자로 온 숫자 입력' },
      { img: 'claude3', text: '이름 입력하고 시작 → <b>왼쪽 아래</b> 내 이름 옆 요금제 확인' }
    ],
    proof: { kind: 'quiz', q: '왼쪽 아래 내 이름 옆(또는 아래)에 보이는 요금제 이름은?', ph: '예: 무료', hint: '로그인하면 왼쪽 아래에 내 이름과 요금제가 보여요. 왼쪽 메뉴가 닫혀 있으면 왼쪽 위 ☰ 버튼을 눌러 보세요.' },
    bonus: 'Claude에게 "나는 고등학교 [과목] 교사야. 오늘 AI 연수에서 꼭 알아야 할 것 3가지만 알려줘"라고 묻고 답을 붙여 넣기' },
  { t: 2, icon: 'chat', title: 'Claude와 첫 대화', min: 10,
    desc: '아래 요청을 복사해 Claude에 붙여 넣고, [ ] 부분만 바꿔 보내 보세요.',

    proof: { kind: 'text', q: 'Claude가 써 준 답을 그대로 붙여 넣으세요', ph: 'Claude의 답을 여기에 붙여 넣기' },
    bonus: '같은 대화에서 "더 재미있게, 이모티콘도 넣어서 바꿔줘"라고 해 보고 결과 붙여 넣기' },
  { t: 3, icon: 'puzzle', title: '한글 스킬 올리기', min: 10,
    desc: 'Claude가 한글(hwpx) 파일을 만들 수 있게 해 주는 "스킬"을 설치해요.',
    links: [{ label: '스킬 파일 받기(구글 드라이브)', url: DRIVE.skill }, { label: 'Claude 설정 열기', url: 'https://claude.ai/settings/capabilities' }],
    steps: [

      { img: 'skill3', text: '스위치가 <b>파란색</b>이면 설치 끝' }
    ],
    proof: { kind: 'quiz', q: '켜진 스킬의 이름을 적어 주세요', ph: '예: hwpx-…', hint: '설정 › 기능(또는 스킬) 화면에 방금 올린 스킬 이름이 보여요.' } },
  { t: 4, icon: 'doc', title: '(선택) 한글 파일 받아 보기', min: 10, optional: true,
    desc: '예시 공문을 Claude에 올리고 한 줄로 요청하면 한글 파일이 나와요. 무료 계정은 도중에 끊길 수 있어요 — 안 되면 건너뛰어도 괜찮아요.',
    links: [{ label: '예시 공문 받기(구글 드라이브)', url: DRIVE.practice }],
    prompt: '올린 공문을 올해 공문으로 바꿔서 한글파일로 만들어줘.',
    steps: [
      { img: 'doc1', text: 'Claude 입력창 <b>+</b> → 예시 공문 파일 올리고 요청 붙여 넣기' },
      { img: 'doc2', text: '완성된 <b>.hwpx 파일 다운로드</b> → 파일 이름 확인' }
    ],
    proof: { kind: 'file', q: '받은 파일 이름을 적어 주세요', ph: '예: 2026 현장체험학습.hwpx' } },
  { t: 5, icon: 'gpt', title: 'ChatGPT로 HTML 게임 만들기', min: 15,
    desc: 'ChatGPT에 Google 계정으로 로그인하고, 내 교과 게임을 HTML 파일로 받아 여기 올려요. 올린 게임은 전시관에 걸려요!',
    links: [{ label: 'ChatGPT 열기', url: 'https://chatgpt.com' }],
    prompt: GAME_PROMPT + '\n- 다 만들면 HTML 파일로 내려받을 수 있게 해줘',
    steps: [
      { img: 'gpt1', text: '오른쪽 위 [로그인] → <b>Google 계정으로 계속하기</b>' },
      { img: 'gpt2', text: '요청 붙여 넣기 → 답 아래 <b>HTML 파일 링크</b>를 눌러 내려받기' },
      { img: 'gpt3', text: '아래 [파일 고르기]로 내려받은 파일 올리기' }
    ],
    proof: { kind: 'html', q: '내려받은 HTML 파일을 올려 주세요' },
    bonus: 'ChatGPT에게 "효과음과 점수 애니메이션을 넣어줘"라고 해 보고, 바뀐 점을 한 줄로 적기' },

    ps.map(function (p) {
      var chips = '';
      for (var i = 0; i <= 8; i++) chips += '<span class="chip ' + (p.done.indexOf(i) >= 0 ? 'd ' : '') + (i === r.turn ? 'cur' : '') + '" data-credit="' + p.pid + ':' + i + '" title="미션 ' + i + '">' + i + '</span>';
      var stt = p.sos ? '<span class="pill p-red">도움 요청</span>' : (p.doneNow ? '<span class="pill p-mint">완료</span>' : (p.peerReq != null ? '<span class="pill p-lav">짝꿍 대기</span>' : '<span class="pill p-gray">진행 중</span>'));
      return '<tr><td><b>' + p.rank + '</b></td><td><span class="online ' + (r.now - p.seen < 20000 ? 'on' : '') + '"></span></td><td><b>' + esc(p.name) + '</b></td><td class="small">' + esc(p.school) + '</td><td><b>' + p.score + '</b></td><td>' + stt + '</td><td>' + (p.ready ? '✅' : '') + '</td><td>' + chips + '</td><td class="small">' + p.badges.length + '개 · 도움 ' + p.helped + '</td><td><button class="b-ghost b-sm" data-kick="' + p.pid + '" title="목록에서 빼기">✕</button></td></tr>';
    }).join('') + '</table></div></div>';
  if (r.gallery.length) h += '<div class="card" style="margin-top:14px"><h3>' + icon('gallery') + ' 전시관 ' + r.gallery.length + '점</h3><div class="list" style="margin-top:10px">' + r.gallery.map(function (g) {
    return '<div class="li"><span class="pill p-gray">' + ({ 5: 'ChatGPT', 6: 'Gemini', 7: 'Claude' }[g.t] || '') + '</span><b>' + esc(g.title) + '</b><span class="grow small">' + esc(g.school) + ' ' + esc(g.name) + ' · ♥ ' + (g.likes || 0) + '</span>' +
      (g.kind === 'link' ? '<a href="' + esc(g.url) + '" target="_blank"><button class="b-sm">열기</button></a>' : '') + '<button class="b-sm ' + (g.hidden ? 'b-pri' : '') + '" data-hide="' + g.gid + '">' + (g.hidden ? '다시 보이기' : '숨기기') + '</button></div>';
  }).join('') + '</div></div>';
  h += '</div>';
  $('#app').innerHTML = h;
  $('#tnext').onclick = function () { if (r.turn < 9 && confirm('다음 턴(' + M[r.turn + 1].title + ')으로 넘길까요?')) Teacher.act({ a: 't_turn', turn: r.turn + 1 }); };
  $('#tprev').onclick = function () { if (confirm('이전 턴으로 돌아갈까요?')) Teacher.act({ a: 't_turn', turn: r.turn - 1 }); };
  $('#tout').onclick = function () { store.del('aiq_teacher'); Teacher.code = null; clearTimeout(Teacher.timer); Teacher.loginView(); };
  document.querySelectorAll('[data-sosok]').forEach(function (b) { b.onclick = function () { Teacher.act({ a: 't_sosOk', target: b.dataset.sosok }); }; });
  document.querySelectorAll('[data-hide]').forEach(function (b) { b.onclick = function () { Teacher.act({ a: 't_hide', gid: b.dataset.hide }); }; });
  document.querySelectorAll('[data-kick]').forEach(function (b) { b.onclick = function () { if (confirm('이 참가자를 목록에서 뺄까요? (점수도 사라져요)')) Teacher.act({ a: 't_kick', target: b.dataset.kick }); }; });
  document.querySelectorAll('[data-credit]').forEach(function (b) {
    b.onclick = function () { var x = b.dataset.credit.split(':'); if (b.classList.contains('d')) return; if (confirm('미션 ' + x[1] + '을(를) 강사 확인으로 인정할까요?')) Teacher.act({ a: 't_credit', target: x[0], t: +x[1] }); };
  });
};

// ═════════ 전광판(큰 화면) ═════════
function Board() {}
Board.code = null; Board.st = null; Board.reveal = 0; Board.qr = false;
Board.start = function (code) {
  Board.code = code;
  var fit = function () { document.body.style.zoom = Math.max(1, Math.min(2.2, innerWidth / 1280)).toFixed(2); };
  fit(); addEventListener('resize', fit);
  document.addEventListener('keydown', function (e) { if (e.key === ' ' || e.key === 'ArrowRight') { Board.reveal = Math.min(4, Board.reveal + 1); Board.render(); } if (e.key === 'ArrowLeft') { Board.reveal = Math.max(0, Board.reveal - 1); Board.render(); } });
  Board.poll();
};
Board.poll = async function () {
  try { var st = await apiGet({ a: 'board', code: Board.code }); if (st.ok) { Board.st = st; Board.render(); } } catch (e) {}
  setTimeout(Board.poll, 2000);
};
Board.render = function () {
  var st = Board.st, m = M[st.turn], join = location.origin + location.pathname + '?code=' + st.code;
  var h = '<div class="board">';
  if (st.turn >= 9 && st.final) {
    var f = st.final, show = Board.reveal;
    h += '<div style="text-align:center"><div class="pill p-sun" style="font-size:20px">' + esc(st.title) + '</div><h1 style="margin-top:10px">' + icon('trophy') + ' 시상식</h1><div class="mute">스페이스바를 누를 때마다 3위 → 2위 → 1위 공개</div></div><div class="podium" style="margin-top:30px">';
    [1, 0, 2].forEach(function (i) {
      var p = f[i]; if (!p) return;
      var vis = (i === 2 && show >= 1) || (i === 1 && show >= 2) || (i === 0 && show >= 3);
      var hgt = [300, 230, 180][i], col = ['#ffc23d', '#9fb3c8', '#e3a06b'][i];
      h += '<div class="p" style="width:320px">' + (vis ? '<div class="reveal"><div class="nm" style="font-size:40px">' + esc(p.name) + '</div><div style="font-size:22px" class="ink2">' + esc(p.school) + ' · ' + p.score + '점</div><div class="badges" style="justify-content:center;margin:8px 0">' + p.badges.slice(0, 5).map(function (k) { return '<img src="' + IMG + 'b_' + k + '.webp" style="width:44px" alt="">'; }).join('') + '</div></div>' : '<div class="nm" style="font-size:40px;color:#cfd3db">?</div>') +
        '<div class="blk" style="height:' + hgt + 'px;background:' + col + ';font-size:80px">' + (i + 1) + '</div></div>';
    });
    h += '</div>';
    if (show >= 4) h += '<div class="card reveal" style="max-width:900px;margin:10px auto 0"><h2>4~10위</h2><div class="rank" style="margin-top:10px">' + f.slice(3, 10).map(function (p) { return '<div class="r"><b>' + p.rank + '</b><span class="grow">' + esc(p.school) + ' ' + esc(p.name) + '</span><b style="width:auto">' + p.score + '</b></div>'; }).join('') + '</div></div>';
    if (show === 3 && !Board.cf) { Board.cf = 1; confetti(); setTimeout(confetti, 900); }
  } else {
    h += '<div class="row" style="align-items:flex-start"><div class="grow"><div class="logo" style="font-size:30px">' + icon('compass') + ' AI 탐험대</div><div class="pill p-gray" style="font-size:18px;margin-top:8px">' + esc(st.title) + '</div>' +
      '<div class="row" style="margin-top:24px;gap:22px">' + icon(m.icon, 'ico-lg') + '<div><div class="pill p-coral" style="font-size:18px">미션 ' + st.turn + ' / 9 · ' + mmss(st.now - st.turnAt) + '</div><h1 style="margin-top:8px">' + esc(m.title) + '</h1></div></div></div>' +
      '<div class="card" style="text-align:center;min-width:300px"><div class="mute">방 번호</div><div class="bigcode">' + st.code + '</div><div id="qr" style="display:flex;justify-content:center;margin-top:10px"></div><div class="small mute" style="margin-top:8px">휴대폰·PC로 QR을 찍거나<br>주소창에 접속</div></div></div>';
    var pd = st.total ? Math.round(st.doneCount / st.total * 100) : 0, pr = st.total ? Math.round(st.readyCount / st.total * 100) : 0;
    h += '<div class="grid2" style="grid-template-columns:1.2fr 1fr"><div class="card"><div class="row"><h2 class="grow">미션 완료</h2><b style="font-size:34px">' + st.doneCount + '/' + st.total + '</b></div><div class="bar" style="margin-top:10px"><i style="width:' + pd + '%"></i></div>' +
      '<div class="row" style="margin-top:20px"><h2 class="grow">준비완료</h2><b style="font-size:34px">' + st.readyCount + '/' + st.total + '</b></div><div class="bar" style="margin-top:10px"><i style="width:' + pr + '%;background:var(--sky)"></i></div>' +
      (st.sosCount ? '<div class="pill p-red" style="font-size:20px;margin-top:18px">' + icon('sos') + ' 도움 요청 ' + st.sosCount + '명 — 도우미 선생님 출동!</div>' : '') + '</div>' +
      '<div class="card"><h2>' + icon('trophy') + ' 상위 5명</h2><div class="rank" style="margin-top:12px;font-size:22px">' + st.top5.map(function (p, i) { return '<div class="r"><b>' + (i < 3 ? '<img src="' + IMG + 'medal' + (i + 1) + '.webp" style="width:34px;vertical-align:middle" alt="' + (i + 1) + '">' : (i + 1)) + '</b><span class="grow">' + esc(p.school) + ' ' + esc(p.name) + '</span><b style="width:auto">' + p.score + '</b></div>'; }).join('') + '</div></div></div>';
    if (st.turn >= 5 && st.gallery.length) h += '<div class="card"><h2>' + icon('gallery') + ' 전시관 ' + st.gallery.length + '점</h2><div class="gal" style="margin-top:12px">' + st.gallery.slice(-8).reverse().map(function (g) { return '<div class="gcard"><span class="pill p-gray k">' + ({ 5: 'ChatGPT', 6: 'Gemini', 7: 'Claude' }[g.t] || '') + '</span><div class="t">' + esc(g.title) + '</div><div class="small mute">' + esc(g.name) + ' · ♥ ' + g.likes + '</div></div>'; }).join('') + '</div></div>';
  }
  h += '</div>';
  $('#app').innerHTML = h;
  var q = $('#qr');
  if (q && window.QRCode) {
    if (!Board.qrSrc || Board.qrFor !== join) {
      var tmp = document.createElement('div'); new QRCode(tmp, { text: join, width: 340, height: 340, correctLevel: QRCode.CorrectLevel.M });
      var cv = tmp.querySelector('canvas'); Board.qrSrc = cv ? cv.toDataURL() : ((tmp.querySelector('img') || {}).src || ''); Board.qrFor = join;
    }
    if (Board.qrSrc) q.innerHTML = '<img src="' + Board.qrSrc + '" style="width:170px;height:170px" alt="입장 QR">';
  }
};

// ───────── 시작 ─────────
if (MODE === 'board') Board.start(Q.get('board'));
else if (MODE === 'teacher') Teacher.start();
else Player.start();
</script>
